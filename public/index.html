<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mantenciones - Retina Lab</title>
<link rel="icon" type="image/jpeg" href="logo-retina.jpg" />
<link rel="apple-touch-icon" href="logo-retina.jpg" />
<style>
  :root {
    --azul: #134678;
    --azul-claro: #e8eef5;
    --gris-fondo: #f3f3f3;
    --borde: #dcdcdc;
    --texto: #222;
    --suave: #6b6b6b;
    --ok: #1a7a3c;
    --ok-fondo: #e3f3e8;
    --error: #b3261e;
    --error-fondo: #fbe9e7;
    --aviso-fondo: #fff6d6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: Arial, sans-serif;
    background: var(--gris-fondo);
    margin: 0;
    color: var(--texto);
    font-size: 14px;
    display: flex;
    flex-direction: column;
  }
  button, input, select { font: inherit; }
  :focus-visible { outline: 2px solid var(--azul); outline-offset: 2px; }

  header {
    background: var(--azul);
    color: white;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p { margin: 2px 0 0 0; font-size: 12px; opacity: 0.85; }
  header[hidden] { display: none; }
  .icono { width: 20px; height: 20px; flex-shrink: 0; }

  /* ---------- Login ---------- */
  #vistaLogin { width: 100%; max-width: 360px; margin: 60px auto; padding: 0 16px; }
  #vistaLogin form {
    background: white;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  #vistaLogin label { display: block; margin-top: 14px; font-weight: 600; }
  #vistaLogin input {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  .boton {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: var(--azul);
    color: white;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
  }
  .boton:disabled { opacity: 0.6; }
  #errorLogin { color: var(--error); margin-top: 12px; min-height: 18px; }

  /* ---------- Vista principal ---------- */
  #vistaApp { display: none; flex: 1; min-height: 0; }

  /* Menú lateral: marca y usuario arriba, planillas al medio, cerrar sesión abajo */
  .menuLateral {
    width: 250px;
    flex-shrink: 0;
    background: white;
    border-right: 1px solid var(--borde);
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .marca { padding: 28px 24px 22px; border-bottom: 1px solid var(--borde); }
  .marca h1 {
    margin: 0 0 10px;
    font-size: 24px;
    color: var(--azul);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo { width: 34px; height: 34px; border-radius: 6px; flex-shrink: 0; }
  .marca .nombre { font-size: 14px; color: var(--texto); }
  .marca .rol { font-size: 12px; color: var(--suave); margin-top: 3px; }
  .menuLateral .tituloMenu {
    margin: 18px 0 6px;
    padding: 0 28px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--suave);
  }
  .menuNavegacion { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  nav.pestanas {
    padding: 0 14px 4px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  nav.pestanas button {
    display: flex;
    align-items: center;
    gap: 14px;
    background: none;
    border: none;
    border-radius: 10px;
    padding: 12px 14px;
    cursor: pointer;
    color: var(--texto);
    font-weight: 600;
    font-size: 15px;
    text-align: left;
  }
  nav.pestanas button:hover { background: #f6f8fb; }
  nav.pestanas button[aria-selected="true"] { background: var(--azul-claro); color: var(--azul); }
  .pieMenu { padding: 14px; border-top: 1px solid var(--borde); }
  .botonMenu {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: white;
    border: 1px solid #cfd4da;
    border-radius: 10px;
    padding: 10px;
    color: var(--texto);
    font-weight: 600;
    cursor: pointer;
  }
  .botonMenu:hover { border-color: var(--azul); color: var(--azul); }
  /* La X y la barra superior solo se usan en celular */
  .cerrarMenu {
    display: none;
    position: absolute;
    top: 16px;
    right: 12px;
    width: 34px;
    height: 34px;
    border: 1px solid var(--borde);
    border-radius: 50%;
    background: white;
    color: var(--suave);
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }
  .barraSuperior { display: none; }
  .fondoMenu { display: none; }

  /* Zona de contenido */
  .contenido { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .encabezadoHoja { padding: 20px 20px 12px; }
  .encabezadoHoja h2 { margin: 0; font-size: 22px; color: var(--azul); }
  .encabezadoHoja p { margin: 4px 0 0; color: var(--suave); font-size: 13px; }

  .barra {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin: 0 20px 8px;
    padding: 10px 12px;
    background: white;
    border: 1px solid var(--borde);
    border-radius: 10px;
  }
  .barra input[type="search"], .barra select {
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
  }
  .barra input[type="search"] { min-width: 220px; flex: 1 1 220px; max-width: 360px; }
  .barra .recargar { margin-left: auto; }
  /* Botón de recargar: solo el ícono de flechas en círculo; gira mientras trae los datos */
  .botonIcono {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: white;
    border: 1px solid var(--azul);
    color: var(--azul);
    border-radius: 8px;
    padding: 6px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .botonIcono:hover { background: var(--azul-claro); }
  .botonIcono.cargando svg { animation: girar 0.9s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  .ayuda { padding: 0 20px 8px; color: var(--suave); font-size: 12px; }

  .contenedorTabla {
    flex: 1;
    overflow: auto;
    margin: 0 20px 20px;
    background: white;
    border-radius: 10px;
    border: 1px solid var(--borde);
  }
  table { border-collapse: separate; border-spacing: 0; width: max-content; min-width: 100%; }
  th, td {
    padding: 8px 10px;
    border-bottom: 1px solid #eee;
    border-right: 1px solid #f2f2f2;
    text-align: left;
    vertical-align: top;
    max-width: 280px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--azul-claro);
    color: var(--azul);
    font-size: 12px;
    z-index: 2;
    cursor: pointer;
    user-select: none;
  }
  thead th .flecha { opacity: 0.6; margin-left: 4px; }
  /* Primera columna (Centro) fija al hacer scroll horizontal */
  th:first-child, td:first-child {
    position: sticky;
    left: 0;
    background: white;
    z-index: 1;
    font-weight: 600;
    border-right: 1px solid var(--borde);
  }
  thead th:first-child { background: var(--azul-claro); z-index: 3; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { background: #fafcff; }
  /* Fila completa según Estado: Activado en verde, Pendiente en amarillo */
  tbody tr.fila-activado td { background: var(--ok-fondo); }
  tbody tr.fila-activado:hover td { background: #d3ebdb; }
  tbody tr.fila-pendiente td { background: var(--aviso-fondo); }
  tbody tr.fila-pendiente:hover td { background: #fbedb8; }
  tbody tr.seleccionada td { background: var(--azul-claro); }
  /* Días restantes: rojo hasta 15, amarillo de 16 a 30 */
  tbody tr td.dias-rojo { background: var(--error-fondo); color: var(--error); font-weight: 600; }
  tbody tr td.dias-amarillo { background: var(--aviso-fondo); color: #9a6700; font-weight: 600; }

  .estado-Activado { color: var(--ok); font-weight: 600; }
  .estado-Pendiente { color: #9a6700; font-weight: 600; }
  .estado-Desactivado { color: var(--suave); font-weight: 600; }

  /* ---------- Selector de columnas ---------- */
  .selectorColumnas { position: relative; }
  .botonSecundario {
    background: white;
    border: 1px solid var(--azul);
    color: var(--azul);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .listaColumnas {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    z-index: 6;
    background: white;
    border: 1px solid var(--borde);
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.12);
    padding: 8px 0;
    min-width: 240px;
    max-height: 60vh;
    overflow-y: auto;
  }
  .listaColumnas label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .listaColumnas label:hover { background: var(--azul-claro); }
  .listaColumnas label.fija { color: var(--suave); cursor: default; }
  .listaColumnas .restablecer {
    display: block;
    width: calc(100% - 28px);
    margin: 6px 14px 2px;
    padding: 6px;
    background: none;
    border: none;
    border-top: 1px solid #eee;
    color: var(--azul);
    cursor: pointer;
    text-align: left;
  }

  /* ---------- Panel lateral ---------- */
  .panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: 420px;
    max-width: 100vw;
    background: white;
    box-shadow: -4px 0 18px rgba(0,0,0,0.15);
    z-index: 8;
    display: flex;
    flex-direction: column;
  }
  .panel[hidden] { display: none; }
  .panelCabecera {
    background: var(--azul);
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .panelCabecera .sub { font-size: 12px; opacity: 0.85; }
  .panelCabecera h2 { margin: 2px 0 0; font-size: 18px; word-break: break-word; }
  .panelCabecera button {
    background: transparent;
    color: white;
    border: 1px solid rgba(255,255,255,0.6);
    border-radius: 6px;
    width: 32px;
    height: 32px;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    flex-shrink: 0;
  }
  .panelAyuda { padding: 10px 16px; color: var(--suave); font-size: 12px; border-bottom: 1px solid #eee; }
  .panelCuerpo { flex: 1; overflow-y: auto; padding: 6px 16px 20px; }
  .campo { margin-top: 12px; }
  .campo label, .campo .etiqueta {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--azul);
    margin-bottom: 4px;
  }
  .campo input, .campo select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: white;
  }
  .campo select + input { margin-top: 6px; }
  .campo .notaCampo { margin-top: 4px; font-size: 12px; color: var(--suave); }
  .campo .notaCampo[hidden] { display: none; }
  .campo input:focus, .campo select:focus { border-color: var(--azul); outline: none; box-shadow: 0 0 0 1px var(--azul); }
  .campo .valorBloqueado {
    padding: 8px 10px;
    border: 1px solid #eee;
    border-radius: 8px;
    background: #f5f5f5;
    color: var(--suave);
    min-height: 36px;
    word-break: break-word;
  }
  .campo.bloqueado .etiqueta { color: var(--suave); }
  .campo .valorBloqueado.dias-rojo { background: var(--error-fondo); color: var(--error); font-weight: 600; }
  .campo .valorBloqueado.dias-amarillo { background: var(--aviso-fondo); color: #9a6700; font-weight: 600; }
  .campo .valorLectura {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    min-height: 34px;
    word-break: break-word;
  }
  .campo .vacio { color: #aaa; }
  .campo input[readonly] { background: #f5f5f5; color: var(--suave); }

  /* Periodos del mismo centro (SAMS + Historial) */
  .periodos {
    margin-top: 12px;
    padding: 10px 12px;
    border: 1px solid #d5e1ee;
    border-radius: 10px;
    background: #f7fafd;
  }
  .periodos h3 { margin: 0 0 6px; font-size: 13px; color: var(--azul); }
  .periodos .periodo {
    display: block;
    width: 100%;
    text-align: left;
    padding: 6px 8px;
    margin-top: 2px;
    border: none;
    border-radius: 6px;
    background: none;
    color: var(--texto);
    font-size: 13px;
  }
  .periodos button.periodo { cursor: pointer; color: var(--azul); }
  .periodos button.periodo:hover { background: var(--azul-claro); }
  .periodos .periodo.esEste { font-weight: 600; }
  .campo.cambiado input, .campo.cambiado select { border-color: var(--azul); background: #f4f8fc; }
  .campo.guardando input, .campo.guardando select { background: var(--aviso-fondo); }
  .campo.guardado input { background: var(--ok-fondo); transition: background 1.2s; }
  .campo.conError input, .campo.conError select { background: var(--error-fondo); border-color: var(--error); }
  .panelPie {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--borde);
    background: white;
  }
  .panelPie:empty { display: none; }
  .panelPie button { flex: 1; padding: 10px 12px; }
  .botonPrimario {
    background: var(--azul);
    color: white;
    border: 1px solid var(--azul);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .botonPrimario:hover { background: #0f3a64; }
  .botonPeligro {
    background: white;
    color: var(--error);
    border: 1px solid var(--error);
    border-radius: 8px;
    padding: 7px 12px;
    cursor: pointer;
    font-weight: 600;
  }
  .botonPeligro:hover { background: var(--error-fondo); }
  button:disabled { opacity: 0.6; cursor: wait; }

  /* ---------- Vistas: tabla o mapa ---------- */
  .vista { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .vista[hidden] { display: none; }

  /* ---------- Mapa de barrios ---------- */
  .vistaMapa {
    flex-direction: row;
    margin: 0 20px 20px;
    background: white;
    border: 1px solid var(--borde);
    border-radius: 10px;
    overflow: hidden;
  }
  .mapaLista {
    width: 300px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--borde);
  }
  .mapaHerramientas { padding: 12px; border-bottom: 1px solid #eee; display: grid; gap: 8px; }
  .mapaHerramientas input {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  .mapaBotones { display: flex; gap: 8px; }
  .mapaBotones .botonSecundario { flex: 1; }
  .listaBarrios { flex: 1; overflow-y: auto; padding: 4px 0 12px; }
  .grupoBarrio { margin-top: 6px; }
  .cabeceraBarrio {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 7px 14px;
    border: none;
    background: none;
    cursor: pointer;
    text-align: left;
    font-weight: 600;
    color: var(--azul);
  }
  .cabeceraBarrio:hover, .itemCentro:hover { background: #f6f8fb; }
  .cabeceraBarrio .muestra { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  .cabeceraBarrio .nombreBarrio { flex: 1; }
  .cabeceraBarrio .cuenta { color: var(--suave); font-weight: 400; }
  .grupoBarrio.fuera .cabeceraBarrio { color: var(--error); }
  .itemCentro {
    display: block;
    width: 100%;
    padding: 5px 14px 5px 36px;
    border: none;
    background: none;
    cursor: pointer;
    text-align: left;
    color: var(--texto);
  }
  .listaBarrios .vacio { padding: 16px; color: var(--suave); }
  /* El mapa crea su propio contexto: sus capas (z-index 400 a 1000) no tapan el panel ni los avisos */
  .mapa { flex: 1; min-width: 0; position: relative; z-index: 0; }
  /* En pantallas medianas la lista va bajo el mapa para que el mapa no quede angosto */
  @media (max-width: 1000px) {
    .vistaMapa { flex-direction: column-reverse; }
    .mapaLista { width: auto; height: 40%; border-right: none; border-top: 1px solid var(--borde); }
  }
  .popupCentro h3 { margin: 0 0 2px; font-size: 15px; color: var(--azul); }
  .popupCentro .barrioPopup { margin: 0 0 8px; font-weight: 600; }
  .popupCentro .barrioPopup.fuera { color: var(--error); }
  .popupCentro .dato { display: flex; gap: 8px; padding: 1px 0; }
  .popupCentro .dato span:first-child { color: var(--suave); min-width: 92px; }
  .popupCentro .botonPrimario { width: 100%; margin-top: 8px; }

  .mensajeCentro { padding: 40px 20px; text-align: center; color: var(--suave); }

  #aviso {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: var(--texto);
    color: white;
    padding: 12px 16px;
    border-radius: 10px;
    max-width: 90vw;
    display: none;
    z-index: 10;
    pointer-events: none;  /* no bloquea los botones que quedan debajo */
  }
  /* Con el panel abierto, el aviso sube para no tapar Guardar / Agregar */
  .panel:not([hidden]) ~ #aviso { bottom: 84px; }
  #aviso.error { background: var(--error); }

  @media (max-width: 640px) {
    header { padding: 14px 16px; }
    /* En celular el menú lateral se abre desde la izquierda y se cierra con la X */
    .menuLateral {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 82vw;
      max-width: 280px;
      z-index: 9;
      transform: translateX(-100%);
      transition: transform 0.2s;
      box-shadow: 4px 0 18px rgba(0,0,0,0.15);
    }
    #vistaApp.menuAbierto .menuLateral { transform: none; }
    #vistaApp.menuAbierto .fondoMenu {
      display: block;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.3);
      z-index: 8;
    }
    .cerrarMenu { display: flex; }
    .barraSuperior {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      border-bottom: 1px solid var(--borde);
      padding: 10px 12px;
    }
    .barraSuperior button {
      display: flex;
      background: none;
      border: 1px solid var(--borde);
      border-radius: 8px;
      padding: 6px;
      color: var(--azul);
      cursor: pointer;
    }
    .barraSuperior strong { color: var(--azul); font-size: 18px; }
    .encabezadoHoja { padding: 14px 12px 10px; }
    .barra { margin: 0 8px 8px; }
    .barra input[type="search"] { min-width: 0; flex-basis: 100%; max-width: none; }
    .ayuda { padding: 0 12px 8px; }
    .contenedorTabla { margin: 0 8px 12px; }
    /* En celular: mapa arriba y lista abajo */
    .vistaMapa { flex-direction: column-reverse; margin: 0 8px 12px; }
    .mapaLista { width: auto; height: 45%; border-right: none; border-top: 1px solid var(--borde); }
    .barra .recargar { margin-left: 0; }
    .panel { width: 100vw; }
  }
</style>
</head>
<body>

<!-- Encabezado solo para la pantalla de ingreso -->
<header id="encabezadoLogin">
  <div>
    <h1>Mantenciones</h1>
    <p>Operaciones Retina Lab</p>
  </div>
</header>

<!-- Login -->
<div id="vistaLogin">
  <form id="formLogin">
    <label for="usuario">Usuario</label>
    <input id="usuario" autocomplete="username" required />
    <label for="clave">Clave</label>
    <input id="clave" type="password" autocomplete="current-password" required />
    <button class="boton" type="submit">Ingresar</button>
    <div id="errorLogin" role="alert"></div>
  </form>
</div>

<!-- App -->
<div id="vistaApp">
  <aside class="menuLateral" id="menuLateral">
    <button class="cerrarMenu" id="btnCerrarMenu" type="button" aria-label="Cerrar menú">
      <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div class="marca">
      <h1><img class="logo" src="logo-retina.jpg" alt="" />Retina</h1>
      <div class="nombre" id="nombreUsuario"></div>
      <div class="rol" id="rolUsuario">Mantenciones</div>
    </div>
    <div class="menuNavegacion">
      <div class="tituloMenu" id="tituloMenu">Planillas</div>
      <nav class="pestanas" id="pestanas" role="tablist" aria-labelledby="tituloMenu"></nav>
      <div class="tituloMenu" id="tituloMapas">Mapas</div>
      <nav class="pestanas" aria-labelledby="tituloMapas">
        <button type="button" id="btnMapa" aria-selected="false">

<div id="aviso" role="status"></div>

<script>
const estado = {
  usuario: null,
  admin: false,         // solo los administradores ven "Eliminar"
  hojas: [],
  hojaActual: null,
  vista: 'tabla',       // 'tabla' o 'mapa'
  datos: null,          // respuesta del servidor: columnas, filas, columnaClave
  orden: { columna: null, asc: true },
  visibles: new Set(),  // nombres de columnas que se muestran en la tabla
  filaAbierta: null,    // número de fila que muestra el panel lateral
  modoPanel: null,      // 'ver', 'editar' o 'nuevo'
  cache: {}             // datos ya leídos de cada planilla, para cambiar entre ellas sin esperar
};

// Columnas que se muestran si el usuario no ha elegido otras, por planilla
const COLUMNAS_POR_DEFECTO = {
  sams: ['Centro', 'Estado', 'INICIO', 'FIN', 'Empresa', 'Barrio', 'Bam - Starlink - Internet',
    'Version', 'Fecha mantención', 'Días restantes'],
  historial: ['Código', 'Centro', 'Estado', 'INICIO', 'FIN', 'Empresa', 'Barrio', 'REGION', 'SIEP', 'Version']
};

// El mapa de barrios muestra los centros vigentes de esta planilla
const HOJA_MAPA = 'sams';

// Ícono de cada planilla en el menú (por defecto, una tabla)
const ICONOS_HOJA = {
  historial: '<rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/>'
};
const ICONO_TABLA = '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/>';

// Columnas que se editan con lista desplegable (nombres normalizados).
// fijas: opciones que siempre aparecen; además se suman los valores que ya hay en la planilla.
// otro: permite escribir un valor nuevo que no esté en la lista.
const LISTAS = {
  'estado': { fijas: ['Activado', 'Pendiente', 'Desactivado'], otro: false },
  'ups': { fijas: ['Si', 'No'], otro: false },
  'bam - starlink - internet': { fijas: ['BAM', 'Starlink', 'Internet Centro'], otro: true },
  'empresa': { fijas: [], otro: true },
  'region': { fijas: [], otro: true },
  'version': { fijas: [], otro: true }
};
const OTRO = '__otro__';

// Columnas que se editan con calendario (nombres normalizados). En el Sheet van como 15/10/2026.
const CALENDARIOS = ['inicio', 'fin'];

// ---------- Utilidades ----------

// Compara nombres sin importar mayúsculas, tildes ni espacios extra
function normalizar(texto) {
  return String(texto).normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase().replace(/\s+/g, ' ').trim();
}

// Solo para mostrar: "Región de Los Lagos (X)" -> "Los Lagos (X)"
function acortarRegion(valor) {
  return valor
    .replace(/^Regi[oó]n\s+del?\s+/i, '')
    .replace(/^Ays[eé]n del General Carlos Ib[aá][ñn]ez del Campo/i, 'Aysén')
    .replace(/^Magallanes y (de )?la Ant[aá]rtica Chilena/i, 'Magallanes');
}

function valorVisible(columna, valor) {
  return normalizar(columna) === 'region' ? acortarRegion(valor) : valor;
}

// Clase de color para Días restantes: rojo hasta 15, amarillo de 16 a 30
function claseDias(columna, valor) {
  if (normalizar(columna) !== 'dias restantes') return '';
  const n = parseInt(String(valor).trim(), 10);
  if (isNaN(n)) return '';
  if (n <= 15) return 'dias-rojo';
  if (n <= 30) return 'dias-amarillo';
  return '';
}

async function api(url, opciones = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    ...opciones
  });
  const datos = await res.json().catch(() => ({ ok: false, error: 'Respuesta inválida del servidor' }));
  if (res.status === 401 && url !== '/api/login') mostrarLogin();
  return datos;
}

let temporizadorAviso;
function avisar(texto, esError = false) {
  const el = document.getElementById('aviso');
  el.textContent = texto;
  el.className = esError ? 'error' : '';
  el.style.display = 'block';
  clearTimeout(temporizadorAviso);
  temporizadorAviso = setTimeout(() => { el.style.display = 'none'; }, esError ? 6000 : 2500);
}

// ---------- Login ----------

function mostrarLogin() {
  document.getElementById('vistaLogin').style.display = 'block';
  document.getElementById('vistaApp').style.display = 'none';
  document.getElementById('encabezadoLogin').hidden = false;
}

function mostrarApp() {
  document.getElementById('vistaLogin').style.display = 'none';
  document.getElementById('vistaApp').style.display = 'flex';
  document.getElementById('encabezadoLogin').hidden = true;
  document.getElementById('nombreUsuario').textContent = estado.usuario;
  document.getElementById('rolUsuario').textContent = estado.admin ? 'Administrador' : 'Mantenciones';
}

// ---------- Menú lateral en celular ----------

function abrirMenu(abrir) {
  document.getElementById('vistaApp').classList.toggle('menuAbierto', abrir);
  if (abrir) document.getElementById('btnCerrarMenu').focus();
}

document.getElementById('btnAbrirMenu').addEventListener('click', () => abrirMenu(true));
document.getElementById('btnCerrarMenu').addEventListener('click', () => abrirMenu(false));
document.getElementById('fondoMenu').addEventListener('click', () => abrirMenu(false));

document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const boton = e.target.querySelector('button');
  const error = document.getElementById('errorLogin');
  boton.disabled = true;
  error.textContent = '';
  const r = await api('/api/login', {
    method: 'POST',
    body: JSON.stringify({
      usuario: document.getElementById('usuario').value,
      clave: document.getElementById('clave').value
    })
  });
  boton.disabled = false;
  if (!r.ok) { error.textContent = r.error; return; }
  document.getElementById('clave').value = '';
  iniciar();
});

document.getElementById('btnSalir').addEventListener('click', async () => {
  await api('/api/logout', { method: 'POST' });
  mostrarLogin();
});

// ---------- Inicio y pestañas ----------

async function iniciar() {
  const r = await api('/api/yo');
  if (!r.ok) { mostrarLogin(); return; }
  estado.usuario = r.usuario;
  estado.admin = !!r.admin;
  estado.hojas = r.hojas;
  mostrarApp();
  dibujarPestanas();
  await cambiarHoja(estado.hojaActual || r.hojas[0].id);
  precargarHojas();
}

// Lee en segundo plano las otras planillas: así cambiar entre ellas es inmediato
// y la ficha de un centro puede mostrar todos sus periodos (SAMS + Historial)
async function precargarHojas() {
  for (const h of estado.hojas) {
    if (estado.cache[h.id]) continue;
    const r = await api('/api/hojas/' + h.id);
    if (r.ok) estado.cache[h.id] = prepararDatos(r);
  }
  if (estado.modoPanel === 'ver' && estado.filaAbierta !== null) {
    const fila = buscarFila(estado.filaAbierta);
    if (fila) dibujarPanel(fila);
  }
}

function dibujarPestanas() {
  const nav = document.getElementById('pestanas');
  nav.innerHTML = '';
  estado.hojas.forEach(h => {
    const b = document.createElement('button');
    b.type = 'button';
    b.role = 'tab';
    b.innerHTML = '<svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      (ICONOS_HOJA[h.id] || ICONO_TABLA) + '</svg>';
    const texto = document.createElement('span');
    texto.textContent = h.titulo;
    b.appendChild(texto);
    b.dataset.hoja = h.id;
    b.addEventListener('click', () => { abrirMenu(false); cambiarHoja(h.id); });
    nav.appendChild(b);
  });
}

async function cambiarHoja(id) {
  if (!cerrarPanel()) return;
  // Volver desde el mapa a la misma planilla: los datos ya están cargados, no hace falta
  // pedirlos de nuevo a Google (eso demora varios segundos). Para datos frescos está "Recargar".
  if (id === estado.hojaActual && estado.datos && estado.vista !== 'tabla') {
    mostrarVista('tabla');
    const hoja = estado.hojas.find(h => h.id === id);
    document.getElementById('tituloHoja').textContent = hoja ? hoja.titulo : '';
    dibujarTabla();
    return;
  }
  if (id !== estado.hojaActual) estado.orden = { columna: null, asc: true };
  estado.hojaActual = id;
  mostrarVista('tabla');
  const hoja = estado.hojas.find(h => h.id === id);
  document.getElementById('tituloHoja').textContent = hoja ? hoja.titulo : '';
  document.getElementById('conteo').textContent = '';
  // Si ya se había leído, se muestra al instante y se actualiza en segundo plano
  if (estado.cache[id]) {
    mostrarHoja(estado.cache[id]);
    cargarHoja({ silencioso: true });
    return;
  }
  await cargarHoja();
}

// La columna clave va primero, el resto en el orden del Sheet
function prepararDatos(r) {
  const clave = r.columnaClave;
  r.columnas.sort((a, b) => (b.nombre === clave) - (a.nombre === clave));
  r.cargadoEn = Date.now();
  return r;
}

function mostrarHoja(datos) {
  estado.datos = datos;
  estado.ultimaCarga = datos.cargadoEn;
  mostrarHoraActualizacion();
  document.getElementById('btnAgregar').textContent = '+ ' + textoAgregar();
  cargarVisibles();
  llenarFiltros();
  dibujarTabla();
}

// En Historial cada fila es un periodo, identificado por su Código
function hojaConCodigo() {
  return normalizar(estado.datos?.columnaClave || '') === 'codigo';
}
function textoAgregar() {
  return hojaConCodigo() ? 'Agregar periodo' : 'Agregar centro';
}

function mostrarVista(vista) {
  estado.vista = vista;
  document.getElementById('vistaTabla').hidden = vista !== 'tabla';
  document.getElementById('vistaMapa').hidden = vista !== 'mapa';
  document.querySelectorAll('#pestanas button').forEach(b => {
    b.setAttribute('aria-selected', vista === 'tabla' && b.dataset.hoja === estado.hojaActual ? 'true' : 'false');
  });
  document.getElementById('btnMapa').setAttribute('aria-selected', vista === 'mapa' ? 'true' : 'false');
}

// silencioso: recarga automática, sin "Cargando..." y sin tocar nada si se está editando
async function cargarHoja(opciones) {
  const silencioso = opciones?.silencioso === true;
  const contenedor = document.getElementById('contenedorTabla');
  if (!silencioso) contenedor.innerHTML = '<div class="mensajeCentro">Cargando...</div>';
  const botones = document.querySelectorAll('#btnRecargar, #btnRecargarMapa');
  botones.forEach(b => b.classList.add('cargando'));
  const hoja = estado.hojaActual;
  const r = await api('/api/hojas/' + hoja);
  botones.forEach(b => b.classList.remove('cargando'));
  if (r.ok) estado.cache[hoja] = prepararDatos(r);
  if (estado.hojaActual !== hoja) return;               // se cambió de planilla mientras cargaba
  if (silencioso && (!r.ok || estaEditando())) return;  // se intenta de nuevo en la próxima vuelta
  if (!r.ok) {
    contenedor.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'mensajeCentro';
    div.textContent = r.error + ' Usa Recargar para intentar de nuevo.';
    contenedor.appendChild(div);
    return;
  }
  mostrarHoja(r);
  // Si el panel estaba abierto en modo lectura, se vuelve a dibujar con los datos recién leídos.
  // Si se está editando o agregando, no se toca para no perder lo escrito.
  if (estado.filaAbierta !== null && estado.modoPanel === 'ver') {
    const fila = buscarFila(estado.filaAbierta);
    if (fila) dibujarPanel(fila);
    else cerrarPanel();
  }
}

document.getElementById('btnRecargar').addEventListener('click', () => cargarHoja());

// ---------- Recarga automática ----------
// Trae los cambios hechos en el Sheet o por otras personas sin presionar "Recargar".
// Solo con la página a la vista y nunca mientras se edita o agrega un centro.
const RECARGA_AUTOMATICA_MS = 2 * 60 * 1000;

function estaEditando() {
  return estado.modoPanel === 'editar' || estado.modoPanel === 'nuevo';
}

function recargarSiCorresponde() {
  if (document.hidden || !estado.datos || estaEditando()) return;
  if (Date.now() - (estado.ultimaCarga || 0) < RECARGA_AUTOMATICA_MS) return;
  if (document.getElementById('vistaApp').style.display !== 'flex') return;  // pantalla de ingreso
  cargarHoja({ silencioso: true });
}

function mostrarHoraActualizacion() {
  const hora = new Date(estado.ultimaCarga).toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  document.getElementById('actualizado').textContent = '· Actualizado ' + hora;
}

setInterval(recargarSiCorresponde, 30 * 1000);
document.addEventListener('visibilitychange', recargarSiCorresponde);

// ---------- Columnas visibles ----------

// v3: al sumar INICIO y FIN a las columnas por defecto, todos vuelven a ver el nuevo conjunto una vez
function claveAlmacen() {
  return 'mantenciones.columnas.v3.' + estado.hojaActual;
}

function cargarVisibles() {
  const nombres = estado.datos.columnas.map(c => c.nombre);
  let guardadas = null;
  try { guardadas = JSON.parse(localStorage.getItem(claveAlmacen())); } catch {}

  let elegidas;
  if (Array.isArray(guardadas)) {
    elegidas = nombres.filter(n => guardadas.includes(n));
  }
  if (!elegidas || !elegidas.length) {
    const porDefecto = (COLUMNAS_POR_DEFECTO[estado.hojaActual] || COLUMNAS_POR_DEFECTO.sams).map(normalizar);
    elegidas = nombres.filter(n => porDefecto.includes(normalizar(n)));
  }
  estado.visibles = new Set(elegidas);
  estado.visibles.add(estado.datos.columnaClave);  // Centro siempre se ve
  dibujarListaColumnas();
}

function guardarVisibles() {
  try { localStorage.setItem(claveAlmacen(), JSON.stringify([...estado.visibles])); } catch {}
}

function dibujarListaColumnas() {
  const lista = document.getElementById('listaColumnas');
  lista.innerHTML = '';
  estado.datos.columnas.forEach(c => {
    const label = document.createElement('label');
    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = estado.visibles.has(c.nombre);
    if (c.nombre === estado.datos.columnaClave) {
      check.disabled = true;
      label.classList.add('fija');
    }
    check.addEventListener('change', () => {
      if (check.checked) estado.visibles.add(c.nombre);
      else estado.visibles.delete(c.nombre);
      guardarVisibles();
      dibujarTabla();
    });
    label.append(check, c.nombre);
    lista.appendChild(label);
  });
  const restablecer = document.createElement('button');
  restablecer.type = 'button';
  restablecer.className = 'restablecer';
  restablecer.textContent = 'Volver a las columnas por defecto';
  restablecer.addEventListener('click', () => {
    try { localStorage.removeItem(claveAlmacen()); } catch {}
    cargarVisibles();
    dibujarTabla();
  });
  lista.appendChild(restablecer);
}

function abrirListaColumnas(abrir) {
  document.getElementById('listaColumnas').hidden = !abrir;
  document.getElementById('btnColumnas').setAttribute('aria-expanded', abrir ? 'true' : 'false');
}

document.getElementById('btnColumnas').addEventListener('click', () => {
  abrirListaColumnas(document.getElementById('listaColumnas').hidden);
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.selectorColumnas')) abrirListaColumnas(false);
});

// ---------- Filtros ----------

function llenarFiltros() {
  llenarSelect('filtroEstado', 'Estado', 'Todos los estados');
  llenarSelect('filtroEmpresa', 'Empresa', 'Todas las empresas');
}

function llenarSelect(id, columna, textoTodos) {
  const select = document.getElementById(id);
  const previo = select.value;
  const existe = estado.datos.columnas.some(c => c.nombre === columna);
  select.hidden = !existe;
  select.innerHTML = '';
  const opcionTodos = new Option(textoTodos, '');
  select.add(opcionTodos);
  if (!existe) return;
  const valores = [...new Set(estado.datos.filas.map(f => f.celdas[columna]).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, 'es'));
  valores.forEach(v => select.add(new Option(v, v)));
  if (valores.includes(previo)) select.value = previo;
}

['buscar', 'filtroEstado', 'filtroEmpresa'].forEach(id => {
  document.getElementById(id).addEventListener('input', dibujarTabla);
});

function filasVisibles() {
  const texto = document.getElementById('buscar').value.trim().toLowerCase();
  const fEstado = document.getElementById('filtroEstado').value;
  const fEmpresa = document.getElementById('filtroEmpresa').value;

  let filas = estado.datos.filas.filter(f => {
    if (fEstado && f.celdas['Estado'] !== fEstado) return false;
    if (fEmpresa && f.celdas['Empresa'] !== fEmpresa) return false;
    if (texto && !Object.values(f.celdas).some(v => String(v).toLowerCase().includes(texto))) return false;
    return true;
  });

  const { columna, asc } = estado.orden;
  if (columna) {
    filas = [...filas].sort((a, b) => {
      const va = a.celdas[columna] || '';
      const vb = b.celdas[columna] || '';
      const na = parseFloat(va.replace(',', '.'));
      const nb = parseFloat(vb.replace(',', '.'));
      const cmp = (!isNaN(na) && !isNaN(nb) && /^-?[\d.,]+$/.test(va) && /^-?[\d.,]+$/.test(vb))
        ? na - nb
        : va.localeCompare(vb, 'es', { numeric: true });
      return asc ? cmp : -cmp;
    });
  } else {
    // Orden por defecto: Activados primero, luego otros estados, Pendientes y al final Desactivados
    const rango = (f) => {
      const v = normalizar(f.celdas['Estado'] || '');
      if (v.startsWith('activad')) return 0;
      if (v.startsWith('pendient')) return 2;
      if (v.startsWith('desactivad')) return 3;
      return 1;
    };
    filas = [...filas].sort((a, b) => rango(a) - rango(b) || a.fila - b.fila);
  }
  return filas;
}

// ---------- Tabla ----------

function dibujarTabla() {
  const columnas = estado.datos.columnas.filter(c => estado.visibles.has(c.nombre));
  const filas = filasVisibles();
  // El mapa usa los mismos datos: si está a la vista, se actualiza con cada cambio
  if (estado.vista === 'mapa') dibujarMapa();
  else document.getElementById('conteo').textContent = 'Mostrando ' + filas.length + ' de ' + estado.datos.filas.length + (hojaConCodigo() ? ' periodos' : ' centros');

  const tabla = document.createElement('table');
  const thead = tabla.createTHead();
  const trHead = thead.insertRow();
  columnas.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c.nombre;
    th.title = 'Ordenar por ' + c.nombre;
    if (estado.orden.columna === c.nombre) {
      const flecha = document.createElement('span');
      flecha.className = 'flecha';
      flecha.textContent = estado.orden.asc ? '▲' : '▼';
      th.appendChild(flecha);
    }
    // Clic: ascendente, descendente y de vuelta al orden por defecto
    th.addEventListener('click', () => {
      const { columna, asc } = estado.orden;
      if (columna !== c.nombre) estado.orden = { columna: c.nombre, asc: true };
      else if (asc) estado.orden = { columna: c.nombre, asc: false };
      else estado.orden = { columna: null, asc: true };
      dibujarTabla();
    });
    trHead.appendChild(th);
  });

  const tbody = tabla.createTBody();
  filas.forEach(f => {
    const tr = tbody.insertRow();
    tr.tabIndex = 0;
    tr.dataset.fila = f.fila;
    if (f.fila === estado.filaAbierta) tr.classList.add('seleccionada');
    const estadoFila = normalizar(f.celdas['Estado'] || '');
    if (estadoFila.startsWith('activad')) tr.classList.add('fila-activado');
    else if (estadoFila.startsWith('pendient')) tr.classList.add('fila-pendiente');
    tr.addEventListener('click', () => abrirPanel(f.fila));
    tr.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); abrirPanel(f.fila); }
    });
    columnas.forEach(c => {
      const td = tr.insertCell();
      const valor = f.celdas[c.nombre] || '';
      td.textContent = valorVisible(c.nombre, valor);
      td.title = valor;
      if (c.nombre === 'Estado' && valor) td.classList.add('estado-' + valor.replace(/\s+/g, ''));
      const dias = claseDias(c.nombre, valor);
      if (dias) td.classList.add(dias);
    });
  });

  const contenedor = document.getElementById('contenedorTabla');
  const scrollX = contenedor.scrollLeft, scrollY = contenedor.scrollTop;
  contenedor.innerHTML = '';
  if (!filas.length) {
    contenedor.innerHTML = '<div class="mensajeCentro">No hay filas con esos filtros.</div>';
    return;
  }
  contenedor.appendChild(tabla);
  contenedor.scrollLeft = scrollX;
  contenedor.scrollTop = scrollY;
}

// ---------- Panel lateral: ver, editar y agregar ----------
// Modos: 'ver' (solo lectura), 'editar' (después de presionar Editar), 'nuevo' (agregar centro)

function buscarFila(numero) {
  return estado.datos.filas.find(f => f.fila === Number(numero));
}

function marcarFilaSeleccionada() {
  document.querySelectorAll('tbody tr').forEach(tr => {
    tr.classList.toggle('seleccionada', Number(tr.dataset.fila) === estado.filaAbierta);
  });
}

function camposDelPanel() {
  return [...document.querySelectorAll('#panelCuerpo input[data-columna]')];
}

function hayCambiosSinGuardar() {
  if (document.getElementById('panel').hidden) return false;
  if (estado.modoPanel === 'editar') {
    const fila = buscarFila(estado.filaAbierta);
    return !!fila && camposDelPanel().some(i => i.value !== (fila.celdas[i.dataset.columna] || ''));
  }
  if (estado.modoPanel === 'nuevo') return camposDelPanel().some(i => i.value.trim() !== '');
  return false;
}

// Pregunta antes de perder lo escrito
function puedeDejarPanel() {
  return !hayCambiosSinGuardar() || confirm('Tienes cambios sin guardar. ¿Quieres descartarlos?');
}

function abrirPanel(numero, modo = 'ver') {
  // Clic en la misma fila mientras se edita: no hacer nada
  if (numero === estado.filaAbierta && estado.modoPanel !== 'ver' && modo === 'ver') return;
  if (numero !== estado.filaAbierta && !puedeDejarPanel()) return;
  const fila = buscarFila(numero);
  if (!fila) return;
  estado.filaAbierta = fila.fila;
  estado.modoPanel = modo;
  dibujarPanel(fila);
}

function abrirNuevo() {
  if (!puedeDejarPanel()) return;
  estado.filaAbierta = null;
  estado.modoPanel = 'nuevo';
  dibujarPanel(null);
}

function dibujarPanel(fila) {
  const modo = estado.modoPanel;
  const clave = estado.datos.columnaClave;
  abrirListaColumnas(false);

  document.getElementById('panelSub').textContent = modo === 'nuevo' ? 'Nuevo registro' : clave;
  document.getElementById('panelTitulo').textContent =
    modo === 'nuevo' ? textoAgregar() : (fila.celdas[clave] || 'Fila ' + fila.fila);
  document.getElementById('panelAyuda').textContent = {
    ver: 'Para cambiar algún dato presiona "Editar".',
    editar: 'Cambia los campos que necesites y presiona "Guardar cambios". Los campos grises no se editan desde aquí.',
    nuevo: hojaConCodigo()
      ? 'Completa los datos y presiona "' + textoAgregar() + '". Centro es obligatorio; el Código se arma solo con Centro e INICIO.'
      : 'Completa los datos y presiona "' + textoAgregar() + '". ' + clave + ' es obligatorio. Los campos grises se completan en el Sheet.'
  }[modo];

  const cuerpo = document.getElementById('panelCuerpo');
  cuerpo.innerHTML = '';
  // Todas las columnas, también las ocultas en la tabla
  estado.datos.columnas.forEach((c, i) => {
    const campo = document.createElement('div');
    campo.className = 'campo';
    const valor = fila ? (fila.celdas[c.nombre] || '') : '';

    if (modo !== 'ver' && c.editable) {
      const id = 'campo-' + i;
      const label = document.createElement('label');
      label.htmlFor = id;
      const obligatorio = hojaConCodigo() ? normalizar(c.nombre) === 'centro' : c.nombre === clave;
      label.textContent = c.nombre + (modo === 'nuevo' && obligatorio ? ' *' : '');
      const input = document.createElement('input');
      input.id = id;
      input.value = valor;  // valor completo, también en REGION
      input.dataset.columna = c.nombre;
      input.addEventListener('input', () => {
        campo.classList.remove('conError');
        campo.classList.toggle('cambiado', input.value !== valor);
      });
      const lista = LISTAS[normalizar(c.nombre)];
      if (lista) {
        const select = crearLista(c.nombre, input, opcionesDeLista(c.nombre, lista, valor), lista.otro);
        label.htmlFor = select.id;
        campo.append(label, select, input);
      } else if (CALENDARIOS.includes(normalizar(c.nombre))) {
        const { fecha, nota } = crearCalendario(input);
        label.htmlFor = fecha.id;
        campo.append(label, fecha, input, nota);
      } else {
        campo.append(label, input);
      }
    } else {
      if (!c.editable) campo.classList.add('bloqueado');
      const etiqueta = document.createElement('div');
      etiqueta.className = 'etiqueta';
      etiqueta.textContent = c.nombre + (modo !== 'ver' && !c.editable ? ' (no editable)' : '');
      const texto = document.createElement('div');
      texto.className = c.editable ? 'valorLectura' : 'valorBloqueado';
      if (modo === 'nuevo') texto.textContent = 'Se completa en el Sheet';
      else if (valor) texto.textContent = valor;
      else { texto.textContent = '—'; texto.classList.add('vacio'); }
      const dias = claseDias(c.nombre, valor);
      if (dias) texto.classList.add(dias);
      campo.append(etiqueta, texto);
    }
    cuerpo.appendChild(campo);
  });

  if (modo !== 'ver') {
    completarFinAlDesactivar();
    completarBarrioPorUbicacion();
    if (hojaConCodigo()) codigoAutomatico(modo);
  } else {
    agregarPeriodos(fila, cuerpo);
  }

  // Botones al pie según el modo
  const pie = document.getElementById('panelPie');
  pie.innerHTML = '';
  const boton = (texto, clase, accion) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = clase;
    b.textContent = texto;
    b.addEventListener('click', accion);
    pie.appendChild(b);
    return b;
  };
  if (modo === 'ver') {
    boton('Editar', 'botonPrimario', () => { estado.modoPanel = 'editar'; dibujarPanel(fila); });
    if (estado.admin) boton('Eliminar', 'botonPeligro', () => eliminarCentro(fila));
  } else if (modo === 'editar') {
    boton('Guardar cambios', 'botonPrimario', guardarCambios);
    boton('Cancelar', 'botonSecundario', () => {
      if (!puedeDejarPanel()) return;
      estado.modoPanel = 'ver';
      dibujarPanel(fila);
    });
  } else {
    boton(textoAgregar(), 'botonPrimario', agregarCentro);
    boton('Cancelar', 'botonSecundario', cerrarPanel);
  }

  const panel = document.getElementById('panel');
  const estabaCerrado = panel.hidden;
  panel.hidden = false;
  if (estabaCerrado || modo === 'nuevo') cuerpo.scrollTop = 0;
  marcarFilaSeleccionada();
  const primerCampo = cuerpo.querySelector('input:not([hidden]), select');
  if (modo !== 'ver' && primerCampo) primerCampo.focus();
  else document.getElementById('btnCerrarPanel').focus();
}

// ---------- Historial: código y periodos ----------

// Código de un periodo: Centro-AAAA-MM según INICIO (Yelcho-2024-01). Si ya existe, se agrega -2, -3…
function generarCodigo(centro, inicio) {
  const clave = estado.datos.columnaClave;
  const iso = fechaAIso(inicio);
  const base = centro.trim() + '-' + (iso ? iso.slice(0, 7) : 'sin-fecha');
  let codigo = base, n = 2;
  while (estado.datos.filas.some(f => normalizar(f.celdas[clave] || '') === normalizar(codigo))) codigo = base + '-' + n++;
  return codigo;
}

// El Código no se escribe a mano: al agregar se arma solo y al editar queda fijo
function codigoAutomatico(modo) {
  const campos = camposDelPanel();
  const codigo = campos.find(i => i.dataset.columna === estado.datos.columnaClave);
  if (!codigo) return;
  codigo.readOnly = true;
  codigo.title = 'Se arma solo con Centro e INICIO';
  if (modo !== 'nuevo') return;
  const centro = campos.find(i => normalizar(i.dataset.columna) === 'centro');
  const inicio = campos.find(i => normalizar(i.dataset.columna) === 'inicio');
  const actualizar = () => {
    codigo.value = centro?.value.trim() ? generarCodigo(centro.value, inicio?.value || '') : '';
    codigo.dispatchEvent(new Event('input'));
  };
  [centro, inicio].forEach(i => i && i.addEventListener('input', actualizar));
}

// Todos los periodos del mismo centro en las planillas ya leídas (SAMS + Historial).
// Se reconocen por SIEP, que se mantiene entre periodos; si no hay SIEP, por el nombre.
function periodosDelCentro(fila) {
  const columna = (datos, nombre) => datos.columnas.find(c => normalizar(c.nombre) === nombre)?.nombre;
  const siepDe = (datos, f) => String(f.celdas[columna(datos, 'siep')] || '').trim().replace(/^0+/, '');
  const centroDe = (datos, f) => normalizar(f.celdas[columna(datos, 'centro')] || '');
  const siep = siepDe(estado.datos, fila);
  const centro = centroDe(estado.datos, fila);
  if (!siep && !centro) return [];

  const lista = [];
  estado.hojas.forEach(h => {
    const datos = h.id === estado.hojaActual ? estado.datos : estado.cache[h.id];
    if (!datos) return;
    datos.filas.forEach(f => {
      const mismo = siep ? siepDe(datos, f) === siep : centroDe(datos, f) === centro;
      if (!mismo) return;
      lista.push({
        hoja: h, fila: f,
        inicio: f.celdas[columna(datos, 'inicio')] || '',
        fin: f.celdas[columna(datos, 'fin')] || '',
        estado: f.celdas[columna(datos, 'estado')] || '',
        esEste: h.id === estado.hojaActual && f.fila === fila.fila
      });
    });
  });
  return lista.sort((a, b) => (fechaAIso(a.inicio) || '9999').localeCompare(fechaAIso(b.inicio) || '9999'));
}

function agregarPeriodos(fila, cuerpo) {
  const periodos = periodosDelCentro(fila);
  if (periodos.length < 2) return;
  const seccion = document.createElement('div');
  seccion.className = 'periodos';
  const titulo = document.createElement('h3');
  titulo.textContent = 'Este centro tuvo ' + periodos.length + ' periodos';
  seccion.appendChild(titulo);
  periodos.forEach(p => {
    const vigente = !p.fin && normalizar(p.estado).startsWith('activad');
    const texto = (p.inicio || 'sin fecha') + ' → ' + (p.fin || (vigente ? 'vigente' : '…')) +
      ' · ' + (p.estado || 'sin estado') + ' · ' + p.hoja.titulo;
    const item = document.createElement(p.esEste ? 'div' : 'button');
    item.className = 'periodo' + (p.esEste ? ' esEste' : '');
    item.textContent = texto + (p.esEste ? ' (este)' : '');
    if (!p.esEste) {
      item.type = 'button';
      item.addEventListener('click', () => verPeriodo(p.hoja.id, p.fila.fila));
    }
    seccion.appendChild(item);
  });
  cuerpo.prepend(seccion);
}

async function verPeriodo(hojaId, numero) {
  if (hojaId !== estado.hojaActual || estado.vista !== 'tabla') {
    if (!cerrarPanel()) return;
    await cambiarHoja(hojaId);
  }
  abrirPanel(numero);
}

// Fecha de hoy como se escribe en el Sheet: 15/10/2026
function fechaHoy() {
  const d = new Date();
  return d.getDate() + '/' + (d.getMonth() + 1) + '/' + d.getFullYear();
}

// Al pasar Estado a Desactivado, si FIN está vacío se completa con la fecha de hoy
// (se puede cambiar antes de guardar). Si se vuelve a otro estado, se quita.
function completarFinAlDesactivar() {
  const campos = camposDelPanel();
  const estadoInput = campos.find(i => normalizar(i.dataset.columna) === 'estado');
  const finInput = campos.find(i => normalizar(i.dataset.columna) === 'fin');
  if (!estadoInput || !finInput) return;

  let completadoAuto = false;
  estadoInput.addEventListener('input', () => {
    const desactivado = normalizar(estadoInput.value) === 'desactivado';
    if (desactivado && !finInput.value.trim()) {
      finInput.value = fechaHoy();
      if (finInput.sincronizar) finInput.sincronizar();
      completadoAuto = true;
      finInput.dispatchEvent(new Event('input'));
      avisar('FIN se completó con la fecha de hoy. Puedes cambiarla antes de guardar.');
    } else if (!desactivado && completadoAuto && finInput.value === fechaHoy()) {
      finInput.value = '';
      if (finInput.sincronizar) finInput.sincronizar();
      completadoAuto = false;
      finInput.dispatchEvent(new Event('input'));
    }
  });
}

// Al cambiar LAT o LON se busca en qué polígono de barrios.geojson cae el punto
// y se completa Barrio con su código (por ejemplo 10B). Se puede cambiar antes de guardar.
// Si el punto queda fuera de todos los barrios, Barrio no se toca.
function completarBarrioPorUbicacion() {
  const campos = camposDelPanel();
  const latInput = campos.find(i => MAPA.columnasLat.includes(normalizar(i.dataset.columna)));
  const lonInput = campos.find(i => MAPA.columnasLon.includes(normalizar(i.dataset.columna)));
  const barrioInput = campos.find(i => normalizar(i.dataset.columna) === 'barrio');
  if (!latInput || !lonInput || !barrioInput) return;

  const numero = v => parseFloat(String(v ?? '').trim().replace(',', '.'));
  const actualizar = async () => {
    const lat = numero(latInput.value), lon = numero(lonInput.value);
    if (!isFinite(lat) || !isFinite(lon)) return;
    try {
      await cargarBarrios();
    } catch (err) {
      avisar('No se pudo calcular el barrio: ' + err.message, true);
      return;
    }
    const barrio = barrioDe(lon, lat);
    if (!barrio) {
      avisar('Esa ubicación queda fuera de los barrios del mapa. Barrio no se cambió.');
      return;
    }
    if (barrioInput.value.trim() !== barrio.codigo) {
      barrioInput.value = barrio.codigo;
      barrioInput.dispatchEvent(new Event('input'));
      avisar('Barrio se completó con ' + barrio.codigo + ' según la ubicación.');
    }
  };
  // 'change' ocurre al salir del campo, no con cada tecla
  latInput.addEventListener('change', actualizar);
  lonInput.addEventListener('change', actualizar);
}

// "15/10/2026" <-> "2026-10-15" (formato del calendario del navegador)
function fechaAIso(texto) {
  const m = String(texto).trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  return m ? m[3] + '-' + m[2].padStart(2, '0') + '-' + m[1].padStart(2, '0') : '';
}
function isoAFecha(iso) {
  const [a, m, d] = iso.split('-');
  return Number(d) + '/' + Number(m) + '/' + a;
}

// Igual que las listas: el input oculto guarda el valor y el calendario lo llena.
// Si la celda tiene un texto que no es fecha (por ejemplo "Dic"), se muestra como nota
// y se mantiene hasta que se elija una fecha.
function crearCalendario(input) {
  const fecha = document.createElement('input');
  fecha.type = 'date';
  fecha.id = input.id;
  input.id = input.id + '-texto';
  input.hidden = true;
  const nota = document.createElement('div');
  nota.className = 'notaCampo';

  const sincronizar = () => {
    const texto = input.value.trim();
    fecha.value = fechaAIso(texto);
    nota.hidden = !texto || !!fecha.value;
    nota.textContent = 'Hoy dice "' + texto + '". Elige una fecha para reemplazarlo.';
  };
  fecha.addEventListener('change', () => {
    input.value = fecha.value ? isoAFecha(fecha.value) : '';
    nota.hidden = true;
    input.dispatchEvent(new Event('input'));
  });
  input.sincronizar = sincronizar;
  sincronizar();
  return { fecha, nota };
}

// Opciones de una lista: las fijas, luego las que ya existen en la planilla y el valor actual
function opcionesDeLista(columna, lista, valorActual) {
  const vistas = new Set();
  const agregar = (v, destino) => {
    const n = normalizar(v);
    if (!n || vistas.has(n)) return;
    vistas.add(n);
    destino.push(v.trim());
  };
  const fijas = [], existentes = [];
  lista.fijas.forEach(v => agregar(v, fijas));
  estado.datos.filas.forEach(f => agregar(f.celdas[columna] || '', existentes));
  agregar(valorActual, existentes);
  existentes.sort((a, b) => a.localeCompare(b, 'es', { numeric: true }));
  return fijas.concat(existentes);
}

// El input sigue siendo el que guarda el valor; la lista solo lo llena.
// Con "Otro" el input se muestra para escribir un valor nuevo.
function crearLista(columna, input, opciones, permiteOtro) {
  const select = document.createElement('select');
  select.id = input.id;
  input.id = input.id + '-texto';
  input.placeholder = 'Escribe el nuevo valor';
  input.setAttribute('aria-label', columna + ' (nuevo valor)');
  select.add(new Option('— Sin valor —', ''));
  const esRegion = normalizar(columna) === 'region';
  opciones.forEach(o => select.add(new Option(esRegion ? acortarRegion(o) : o, o)));
  if (permiteOtro) select.add(new Option('Otro (escribir)…', OTRO));

  // Sin importar mayúsculas: "si" en el Sheet muestra la opción "Si"
  const sincronizar = () => {
    const opcion = [...select.options].find(o => o.value !== OTRO && normalizar(o.value) === normalizar(input.value));
    select.value = opcion ? opcion.value : OTRO;
    input.hidden = !!opcion;
  };
  select.addEventListener('change', () => {
    if (select.value === OTRO) {
      input.hidden = false;
      input.value = '';
      input.focus();
    } else {
      input.hidden = true;
      input.value = select.value;
    }
    input.dispatchEvent(new Event('input'));
  });
  input.sincronizar = sincronizar;
  sincronizar();
  return select;
}

function cerrarPanel() {
  const panel = document.getElementById('panel');
  if (panel.hidden) return true;
  if (!puedeDejarPanel()) return false;
  const numero = estado.filaAbierta;
  panel.hidden = true;
  estado.filaAbierta = null;
  estado.modoPanel = null;
  marcarFilaSeleccionada();
  const tr = document.querySelector('tbody tr[data-fila="' + numero + '"]');
  if (tr) tr.focus();
  return true;
}

document.getElementById('btnCerrarPanel').addEventListener('click', cerrarPanel);
document.getElementById('btnAgregar').addEventListener('click', abrirNuevo);

function botonesPie(activos) {
  document.querySelectorAll('#panelPie button').forEach(b => { b.disabled = !activos; });
}

async function guardarCambios() {
  const fila = buscarFila(estado.filaAbierta);
  const clave = estado.datos.columnaClave;
  const cambiados = camposDelPanel().filter(i => i.value !== (fila.celdas[i.dataset.columna] || ''));
  if (!cambiados.length) {
    estado.modoPanel = 'ver';
    dibujarPanel(fila);
    avisar('No había cambios que guardar');
    return;
  }
  const campoClave = cambiados.find(i => i.dataset.columna === clave);
  if (campoClave && !campoClave.value.trim()) {
    campoClave.closest('.campo').classList.add('conError');
    avisar(clave + ' no puede quedar vacío', true);
    return;
  }

  botonesPie(false);
  let errores = 0;
  // Uno por uno, con el mismo guardado de siempre
  for (const input of cambiados) {
    const ok = await guardarCampo(input.closest('.campo'), input, fila, input.dataset.columna);
    if (!ok) errores++;
  }
  dibujarTabla();

  if (!errores) {
    estado.modoPanel = 'ver';
    dibujarPanel(fila);
    avisar(cambiados.length === 1 ? 'Cambio guardado' : cambiados.length + ' cambios guardados');
  } else {
    botonesPie(true);
    document.getElementById('panelTitulo').textContent = fila.celdas[clave] || 'Fila ' + fila.fila;
  }
}

// Solo administradores (el servidor también lo verifica)
async function eliminarCentro(fila) {
  const clave = estado.datos.columnaClave;
  const nombre = fila.celdas[clave] || '';
  const seguro = confirm(
    '¿Eliminar el centro "' + nombre + '"?\n\n' +
    'Se borrará la fila completa del Sheet. Queda una copia de sus datos en el log de ediciones.'
  );
  if (!seguro) return;

  botonesPie(false);
  const r = await api('/api/hojas/' + estado.hojaActual + '/eliminar', {
    method: 'POST',
    body: JSON.stringify({ fila: fila.fila, clave: fila.celdas[clave] || '' })
  });
  if (!r.ok) {
    botonesPie(true);
    avisar(r.error || 'No se pudo eliminar el centro', true);
    return;
  }

  document.getElementById('panel').hidden = true;
  estado.filaAbierta = null;
  estado.modoPanel = null;
  await cargarHoja();
  avisar('Centro "' + nombre + '" eliminado');
}

async function agregarCentro() {
  const clave = estado.datos.columnaClave;
  const celdas = {};
  camposDelPanel().forEach(i => {
    const v = i.value.trim();
    if (v) celdas[i.dataset.columna] = v;
  });

  // En Historial lo obligatorio es Centro (el Código sale de ahí); en SAMS, la columna clave
  const obligatorio = hojaConCodigo()
    ? camposDelPanel().find(i => normalizar(i.dataset.columna) === 'centro')
    : camposDelPanel().find(i => i.dataset.columna === clave);
  const campoClave = camposDelPanel().find(i => i.dataset.columna === clave);
  const nombre = celdas[clave] || '';
  if (!obligatorio.value.trim() || !nombre) {
    obligatorio.closest('.campo').classList.add('conError');
    obligatorio.focus();
    avisar('Escribe el nombre del centro', true);
    return;
  }
  if (estado.datos.filas.some(f => normalizar(f.celdas[clave] || '') === normalizar(nombre))) {
    campoClave.closest('.campo').classList.add('conError');
    campoClave.focus();
    avisar(hojaConCodigo() ? 'Ya existe un periodo con el código "' + nombre + '"' : 'Ya existe un centro llamado "' + nombre + '"', true);
    return;
  }

  botonesPie(false);
  const r = await api('/api/hojas/' + estado.hojaActual + '/agregar', {
    method: 'POST',
    body: JSON.stringify({ celdas })
  });
  if (!r.ok) {
    botonesPie(true);
    avisar(r.error || 'No se pudo agregar el centro', true);
    return;
  }

  // Volver a leer la planilla y mostrar el centro nuevo
  estado.modoPanel = 'ver';
  await cargarHoja();
  const nueva = estado.datos.filas.find(f => normalizar(f.celdas[clave] || '') === normalizar(nombre));
  if (nueva) abrirPanel(nueva.fila);
  else { document.getElementById('panel').hidden = true; estado.modoPanel = null; }
  avisar((hojaConCodigo() ? 'Periodo "' : 'Centro "') + nombre + '" agregado');
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('vistaApp').classList.contains('menuAbierto')) {
    abrirMenu(false);
    document.getElementById('btnAbrirMenu').focus();
  } else if (!document.getElementById('listaColumnas').hidden) {
    abrirListaColumnas(false);
    document.getElementById('btnColumnas').focus();
  } else if (!document.getElementById('panel').hidden) {
    e.preventDefault();
    cerrarPanel();
  }
});

// Guarda una celda; devuelve true si quedó guardada
async function guardarCampo(campo, input, fila, columna) {
  const anterior = fila.celdas[columna] || '';
  const nuevo = input.value;
  if (input.readOnly || nuevo === anterior) return true;

  campo.classList.remove('guardado', 'conError');
  campo.classList.add('guardando');
  input.readOnly = true;

  const r = await api('/api/hojas/' + estado.hojaActual + '/editar', {
    method: 'POST',
    body: JSON.stringify({
      fila: fila.fila,
      columna,
      clave: fila.celdas[estado.datos.columnaClave] || '',
      anterior,
      nuevo
    })
  });

  input.readOnly = false;
  campo.classList.remove('guardando');

  if (r.ok) {
    fila.celdas[columna] = r.valor;
    input.value = r.valor;
    campo.classList.remove('cambiado');
    campo.classList.add('guardado');
    setTimeout(() => campo.classList.remove('guardado'), 1500);
    return true;
  }

  campo.classList.add('conError');
  if (r.conflicto && r.actual !== undefined) {
    // Alguien cambió la celda en el Sheet: mostramos el valor real
    fila.celdas[columna] = r.actual;
    input.value = r.actual;
    if (input.sincronizar) input.sincronizar();
    avisar(columna + ': ' + r.error + '. Ahora muestra el valor actual del Sheet; vuelve a editarla si corresponde.', true);
  } else {
    avisar(columna + ': ' + (r.error || 'No se pudo guardar'), true);
  }
  return false;
}

// ---------- Mapa de barrios ----------
// Viene de la página "Centros por barrio" (mapa-barrios). Usa los mismos datos de la tabla,
// así que queda detrás del ingreso y se actualiza con cada edición.

const MAPA = {
  geojson: 'barrios.geojson',
  propiedadBarrio: 'Nombre_barrio',          // el geojson trae solo el código: 1, 3A, 22D…
  nombreBarrio: codigo => 'Barrio ' + codigo,
  columnasLat: ['lat', 'latitud'],
  columnasLon: ['lon', 'lng', 'long', 'longitud'],
  // Datos que se muestran en la ventanita de cada centro
  datosPopup: ['Estado', 'Empresa', 'Barrio', 'REGION', 'Bam - Starlink - Internet', 'Version', 'Días restantes']
};
const FUERA_DE_BARRIO = 'Fuera de barrio';
const COLORES_BARRIOS = ['#3E8E9A', '#6A9A5B', '#8C7AB0', '#C08A3E', '#4F79B5', '#A0646E', '#5E9C8C', '#7F8C3A'];

let mapa = null, capaBarrios = null, capaCentros = null, barriosMapa = [], centrosMapa = [];

function escaparHtml(texto) {
  return String(texto ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Leaflet se carga solo la primera vez que se abre el mapa
let promesaLeaflet = null;
function cargarLeaflet() {
  if (!promesaLeaflet) {
    promesaLeaflet = new Promise((resolver, rechazar) => {
      const css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
      document.head.appendChild(css);
      const js = document.createElement('script');
      js.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
      js.onload = resolver;
      js.onerror = () => { promesaLeaflet = null; rechazar(new Error('No se pudo cargar el mapa. Revisa tu conexión.')); };
      document.head.appendChild(js);
    });
  }
  return promesaLeaflet;
}

// ¿El punto está dentro del polígono? (anillo exterior y agujeros)
function puntoEnAnillo(lon, lat, anillo) {
  let dentro = false;
  for (let i = 0, j = anillo.length - 1; i < anillo.length; j = i++) {
    const [xi, yi] = anillo[i], [xj, yj] = anillo[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) dentro = !dentro;
  }
  return dentro;
}
function puntoEnPoligono(lon, lat, geometria) {
  const poligonos = geometria.type === 'MultiPolygon' ? geometria.coordinates : [geometria.coordinates];
  return poligonos.some(([exterior, ...agujeros]) =>
    puntoEnAnillo(lon, lat, exterior) && !agujeros.some(a => puntoEnAnillo(lon, lat, a)));
}

function barrioDe(lon, lat) {
  return barriosMapa.find(b => lon >= b.caja[0] && lon <= b.caja[2] && lat >= b.caja[1] && lat <= b.caja[3]
    && puntoEnPoligono(lon, lat, b.feature.geometry)) || null;
}

// Polígonos de barrios.geojson. Los usa el mapa y también el panel para completar Barrio.
let promesaBarrios = null;
function cargarBarrios() {
  if (!promesaBarrios) {
    promesaBarrios = (async () => {
      const r = await fetch(MAPA.geojson);
      if (!r.ok) throw new Error('No se pudo leer ' + MAPA.geojson);
      const fc = await r.json();
      barriosMapa = fc.features.filter(f => f.geometry).map((f, i) => {
        const puntos = (f.geometry.type === 'MultiPolygon' ? f.geometry.coordinates.flat(2) : f.geometry.coordinates.flat());
        const lons = puntos.map(p => p[0]), lats = puntos.map(p => p[1]);
        const codigo = f.properties?.[MAPA.propiedadBarrio] ?? i + 1;
        return {
          feature: f,
          codigo: String(codigo),
          nombre: MAPA.nombreBarrio(codigo),
          color: COLORES_BARRIOS[i % COLORES_BARRIOS.length],
          caja: [Math.min(...lons), Math.min(...lats), Math.max(...lons), Math.max(...lats)]
        };
      });
    })().catch(err => { promesaBarrios = null; throw err; });
  }
  return promesaBarrios;
}

async function iniciarMapa() {
  if (mapa) return;
  await cargarLeaflet();

  mapa = L.map('mapa').setView([-43.5, -73.5], 6);
  const calles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(mapa);
  const satelite = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 18, attribution: 'Tiles &copy; Esri' });
  const topografico = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 18, attribution: 'Tiles &copy; Esri' });
  L.control.layers({ 'Mapa': calles, 'Satélite': satelite, 'Topográfico': topografico }).addTo(mapa);
  capaCentros = L.layerGroup().addTo(mapa);

  await cargarBarrios();
  const porFeature = new Map(barriosMapa.map(b => [b.feature, b]));

  capaBarrios = L.geoJSON({ type: 'FeatureCollection', features: barriosMapa.map(b => b.feature) }, {
    style: f => { const c = porFeature.get(f).color; return { color: c, weight: 1.5, fillColor: c, fillOpacity: 0.18 }; },
    onEachFeature: (f, capa) => {
      const b = porFeature.get(f);
      b.capa = capa;
      capa.bindTooltip(b.nombre, { sticky: true });
    }
  }).addTo(mapa);
  capaBarrios.bringToBack();

  // "Ver ficha" dentro de la ventanita abre el panel lateral del centro
  document.getElementById('mapa').addEventListener('click', (e) => {
    const boton = e.target.closest('[data-ver-ficha]');
    if (boton) abrirPanel(Number(boton.dataset.verFicha));
  });
}

async function abrirMapa() {
  abrirMenu(false);
  if (!cerrarPanel()) return;
  // El mapa muestra los centros vigentes: si se venía de otra planilla, se pasa a SAMS
  if (estado.hojaActual !== HOJA_MAPA) {
    estado.hojaActual = HOJA_MAPA;
    estado.orden = { columna: null, asc: true };
    estado.datos = null;
    if (estado.cache[HOJA_MAPA]) mostrarHoja(estado.cache[HOJA_MAPA]);
  }
  mostrarVista('mapa');
  document.getElementById('tituloHoja').textContent = 'Mapa de barrios';
  document.getElementById('conteo').textContent = 'Cargando mapa...';
  try {
    const primeraVez = !mapa;
    await iniciarMapa();
    if (!estado.datos) await cargarHoja();
    dibujarMapa();
    // El mapa recién ahora tiene su tamaño real; recién ahí se puede encuadrar en los barrios
    mapa.invalidateSize();
    if (primeraVez) mapa.fitBounds(capaBarrios.getBounds(), { padding: [20, 20] });
  } catch (err) {
    document.getElementById('conteo').textContent = err.message;
  }
}

function columnaPorNombres(nombres) {
  return estado.datos.columnas.find(c => nombres.includes(normalizar(c.nombre)))?.nombre;
}

function dibujarMapa() {
  if (!mapa || !estado.datos) return;
  const colLat = columnaPorNombres(MAPA.columnasLat);
  const colLon = columnaPorNombres(MAPA.columnasLon);
  const clave = estado.datos.columnaClave;
  if (!colLat || !colLon) {
    document.getElementById('conteo').textContent = 'La planilla no tiene columnas LAT y LON.';
    return;
  }

  const numero = v => parseFloat(String(v ?? '').trim().replace(',', '.'));
  // Si había una ventanita abierta, se vuelve a abrir después de redibujar (por ejemplo tras la recarga automática)
  const filaAbiertaEnMapa = centrosMapa.find(c => c.marcador?.isPopupOpen())?.fila.fila;
  let sinCoordenadas = 0;
  centrosMapa = estado.datos.filas.map(f => {
    const lat = numero(f.celdas[colLat]), lon = numero(f.celdas[colLon]);
    if (!isFinite(lat) || !isFinite(lon)) { sinCoordenadas++; return null; }
    return { fila: f, nombre: f.celdas[clave] || 'Fila ' + f.fila, lat, lon, barrio: barrioDe(lon, lat) };
  }).filter(Boolean);

  capaCentros.clearLayers();
  centrosMapa.forEach(c => {
    c.marcador = L.circleMarker([c.lat, c.lon], {
      radius: 7, color: '#134678', weight: 2, fillColor: c.barrio ? '#F5B700' : '#D2452B', fillOpacity: 1
    }).bindPopup(() => popupCentro(c)).bindTooltip(escaparHtml(c.nombre), { direction: 'top', offset: [0, -6] })
      .addTo(capaCentros);
  });
  if (filaAbiertaEnMapa) centrosMapa.find(c => c.fila.fila === filaAbiertaEnMapa)?.marcador.openPopup();

  dibujarListaBarrios();

  const fuera = centrosMapa.filter(c => !c.barrio).length;
  const nBarrios = new Set(centrosMapa.filter(c => c.barrio).map(c => c.barrio.nombre)).size;
  let texto = centrosMapa.length + ' centros en ' + nBarrios + ' barrios';
  if (fuera) texto += ', ' + fuera + ' fuera de barrio';
  if (sinCoordenadas) texto += ', ' + sinCoordenadas + ' sin coordenadas';
  document.getElementById('conteo').textContent = texto;
}

function popupCentro(c) {
  const datos = MAPA.datosPopup
    .map(col => [col, c.fila.celdas[col]])
    .filter(([, v]) => v)
    .map(([col, v]) => '<div class="dato"><span>' + escaparHtml(col) + '</span><span>' +
      escaparHtml(valorVisible(col, v)) + '</span></div>')
    .join('');
  return '<div class="popupCentro"><h3>' + escaparHtml(c.nombre) + '</h3>' +
    '<p class="barrioPopup ' + (c.barrio ? '' : 'fuera') + '">' + escaparHtml(c.barrio?.nombre || FUERA_DE_BARRIO) + '</p>' +
    datos +
    '<button type="button" class="botonPrimario" data-ver-ficha="' + c.fila.fila + '">Ver ficha</button></div>';
}

function dibujarListaBarrios() {
  const q = normalizar(document.getElementById('buscarMapa').value);
  const grupos = new Map();
  centrosMapa.forEach(c => {
    const g = c.barrio?.nombre || FUERA_DE_BARRIO;
    if (q && !normalizar(c.nombre).includes(q) && !normalizar(g).includes(q)) return;
    if (!grupos.has(g)) grupos.set(g, []);
    grupos.get(g).push(c);
  });
  const nombres = [...grupos.keys()].sort((a, b) =>
    a === FUERA_DE_BARRIO ? 1 : b === FUERA_DE_BARRIO ? -1 : a.localeCompare(b, 'es', { numeric: true }));

  const lista = document.getElementById('listaBarrios');
  lista.innerHTML = '';
  if (!nombres.length) {
    lista.innerHTML = '<p class="vacio">' + (q ? 'Ningún centro o barrio coincide con la búsqueda.' : 'No hay centros con coordenadas.') + '</p>';
    return;
  }
  nombres.forEach(n => {
    const barrio = barriosMapa.find(b => b.nombre === n);
    const grupo = document.createElement('div');
    grupo.className = 'grupoBarrio' + (n === FUERA_DE_BARRIO ? ' fuera' : '');

    const cabecera = document.createElement('button');
    cabecera.type = 'button';
    cabecera.className = 'cabeceraBarrio';
    cabecera.innerHTML = '<span class="muestra"></span><span class="nombreBarrio"></span><span class="cuenta"></span>';
    cabecera.querySelector('.muestra').style.background = barrio ? barrio.color : 'var(--error)';
    cabecera.querySelector('.nombreBarrio').textContent = n;
    cabecera.querySelector('.cuenta').textContent = grupos.get(n).length;
    cabecera.addEventListener('click', () => {
      if (!barrio?.capa) return;
      capaBarrios.resetStyle();
      barrio.capa.setStyle({ weight: 3, fillOpacity: 0.35 });
      mapa.flyToBounds(barrio.capa.getBounds(), { padding: [30, 30], duration: 0.6 });
    });
    grupo.appendChild(cabecera);

    grupos.get(n)
      .sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es', { numeric: true }))
      .forEach(c => {
        const item = document.createElement('button');
        item.type = 'button';
        item.className = 'itemCentro';
        item.textContent = c.nombre;
        item.addEventListener('click', () => {
          mapa.flyTo([c.lat, c.lon], Math.max(mapa.getZoom(), 12), { duration: 0.6 });
          c.marcador.openPopup();
        });
        grupo.appendChild(item);
      });
    lista.appendChild(grupo);
  });
}

function exportarCsvMapa() {
  const columnas = estado.datos.columnas.map(c => c.nombre);
  const celda = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const lineas = [columnas.concat('Barrio (mapa)').map(celda).join(',')];
  centrosMapa.forEach(c => {
    lineas.push(columnas.map(col => c.fila.celdas[col]).concat(c.barrio?.nombre || '').map(celda).join(','));
  });
  const blob = new Blob(['﻿' + lineas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'centros_con_barrio.csv';
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById('btnMapa').addEventListener('click', abrirMapa);
document.getElementById('buscarMapa').addEventListener('input', dibujarListaBarrios);
document.getElementById('btnRecargarMapa').addEventListener('click', () => cargarHoja());
document.getElementById('btnExportarMapa').addEventListener('click', exportarCsvMapa);
window.addEventListener('resize', () => { if (mapa) mapa.invalidateSize(); });

iniciar();
</script>
